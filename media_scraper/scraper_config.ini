[General]
# Global defaults (can be overridden per artist)
# Options: audio, video
media_type = video
# Audio options: mp3, m4a, wav, etc.
# Video options: webm, mp4, mkv, etc.
# Default format for audio is mp3, for video is webm
format = webm
# Audio quality: 0 (best) to 9 (worst), or specific bitrate like 320K
# Video quality: 1080p, 720p, 480p, etc.
# Default audio is best (0), default video is 720p
quality = 720

# Maximum results per search query (increase for more coverage)
max_results = 20

# FFmpeg location (leave empty to use system PATH)
# Example: C:\Path\To\ffmpeg\bin
ffmpeg_location = C:\Users\John Tan\AppData\Local\Microsoft\WinGet\Packages\Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe\ffmpeg-8.0.1-full_build\bin

